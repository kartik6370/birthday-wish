<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sandeepta 💗</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor"></div>

    <div class="envelope-scene" id="envelopeScene">
        <div class="envelope" id="envelope">
            <div class="envelope-letter">
                <div class="letter-heading">For</div>
                <div class="letter-name">Sandeepta</div>
                <div class="letter-heart">💗</div>
            </div>
            <div class="envelope-front"></div>
            <div class="envelope-flap">
                <div class="wax-seal">S</div>
            </div>
        </div>
        <div class="envelope-hint">tap the envelope to open it 💌</div>
    </div>

    <div class="container" id="mainContent">
        <div class="pre-title">a little something for</div>
        <h1>Happy Birthday<br>Sandeepta 💗</h1>
        <div class="greeting"></div>
        <button class="cta-button">Open Your Surprise 💌</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
